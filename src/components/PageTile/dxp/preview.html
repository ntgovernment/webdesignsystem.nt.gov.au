<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageTile Component Preview</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Lato", system-ui, sans-serif;
            background: #ffffff;
            color: #1F1E27;
            padding: 2rem;
            min-height: 100vh;
        }

        /* PageTile Component Styles */
        .nt-page-tile {
            width: 100%;
            display: block;
        }

        .nt-page-tile__grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            width: 100%;
        }

        /* Grid list items */
        .nt-page-tile__grid>div {
            width: 100%;
            height: 100%;
        }

        .nt-page-tile .tile {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: 1px solid #D3D3D7;
            overflow: hidden;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
            color: inherit;
            border-radius: 0px;
        }

        .nt-page-tile .tile--clickable {
            cursor: pointer;
        }

        .nt-page-tile .tile--clickable:hover {
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08);
            border-color: #D3D3D7;
        }

        .nt-page-tile .tile--clickable:focus {
            outline: none;
        }

        .nt-page-tile .tile--clickable:focus-visible {
            box-shadow: 0px 0px 0px 4px #FFAB00;
            border-radius: 0px;
        }

        .nt-page-tile .tile-body {
            display: flex;
            flex-direction: column;
            padding: 24px 32px;
            flex: 1;
        }

        .nt-page-tile__content {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .page-tile__icon {
            display: none;
        }

        .page-tile__text {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .nt-page-tile__title {
            margin: 0 0 24px 0;
            font-family: "Lato", system-ui, sans-serif;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.33;
            color: #1F1E27;
            word-wrap: break-word;
        }

        .nt-page-tile__description {
            margin: 0 0 24px 0;
            font-family: "Lato", system-ui, sans-serif;
            font-size: 16px;
            line-height: 24px;
            color: #1F1E27;
            max-width: 72ch;
        }

        .nt-page-tile .tile-title {
            margin: 0;
            font-family: "Lato", system-ui, sans-serif;
            font-size: 16px;
            font-weight: 700;
            line-height: 20px;
            color: #1f1f5f;
            word-wrap: break-word;
            transition: color 0.2s ease;
        }

        .nt-page-tile .tile--clickable:hover .tile-title {
            color: #0046a8;
        }

        .page-tile-error {
            background: #fde3e3;
            border: 1px solid #d32f2f;
            border-radius: 0px;
            padding: 32px;
            margin: 16px;
            text-align: center;
        }

        .page-tile-error p {
            margin: 12px 0;
            color: #d32f2f;
        }

        @media (max-width: 768px) {
            .nt-page-tile .tile-body {
                padding: 16px 24px;
            }

            .nt-page-tile .tile-title {
                font-size: 14px;
                line-height: 18px;
            }

            .page-tile__icon {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .nt-page-tile .tile-body {
                padding: 16px;
            }

            .page-tile__icon {
                font-size: 18px;
            }
        }

        @media (prefers-contrast: more) {
            .nt-page-tile .tile {
                border-width: 2px;
            }

            .nt-page-tile .tile--clickable:focus-visible {
                outline: 1px solid #1f1f5f;
                outline-offset: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .nt-page-tile .tile,
            .nt-page-tile .tile-title {
                transition: none;
            }
        }
    </style>
</head>

</body>

</html>
