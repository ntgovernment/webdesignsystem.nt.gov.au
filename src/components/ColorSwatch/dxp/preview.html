<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Swatch Preview - NT Government Web Design System</title>
    <link rel="stylesheet"
        href="https://test1.nt.gov.au/__data/assets/git_bridge/0013/ntgovau/webdesignsystem.nt.gov.au/1.0.0/web-design-system.min.css" />
    <style>
        /* Preview-specific styles using raw values per requirement */
        body {
            font-family: Lato, system-ui, sans-serif;
            padding: 40px;
            background: #f5f5f7;
        }

        .preview-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 4px;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
        }

        .preview-title {
            font-size: 24px;
            font-weight: 700;
            color: #1f1f5f;
            margin-bottom: 16px;
        }

        .preview-content {
            max-width: 100%;
        }

        /* Grid container styles using raw values */
        .nt-color-swatch-grid {
            width: 100%;
        }

        .nt-color-swatch-grid__description {
            font-size: 16px;
            font-weight: 400;
            line-height: 24px;
            color: #1F1E27;
            margin: 0 0 24px 0;
        }

        .nt-color-swatch-grid__container {
            display: grid;
            grid-template-columns: repeat(auto-fill, 136px);
            gap: var(--sp-md, 24px);
            margin-top: 32px;
            width: 100%;
        }

        .nt-color-swatch-grid--no-intro .nt-color-swatch-grid__container {
            margin-top: 24px;
        }

        /* Component override styles using raw values */
        .nt-color-swatch {
            width: 136px;
            padding: 8px;
            background: white;
            border: 1px solid #D3D3D7;
            border-radius: 0px;
        }

        .nt-color-swatch__sample {
            width: 100%;
            height: 99px;
            border-radius: 0px;
        }

        .nt-color-swatch__content {
            padding: 8px;
            gap: 4px;
        }

        .nt-color-swatch__label {
            font-size: 16px;
            font-weight: 700;
            line-height: 24px;
            color: #1F1E27;
        }

        .nt-color-swatch__hex {
            font-size: 14px;
            font-weight: 400;
            line-height: 20px;
            color: #666774;
        }
    </style>
</head>

<body>
    <div class="preview-container">
        <h1 class="preview-title">Color Swatch Component</h1>
        <div class="preview-content">[component://output]</div>
    </div>
</body>

</html>
