<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComponentViewer Preview</title>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/9bf658a5c7.js" crossorigin="anonymous"></script>

    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Lato, sans-serif;
            background: #ffffff;
            color: #1F1E27;
            padding: 2rem;
            min-height: 100vh;
        }

        /* ComponentViewer Component Styles */
        .nt-component-viewer {
            width: 100%;
            display: flex;
            flex-direction: column;
            font-family: Lato, sans-serif;
        }

        /* Preview Section */
        .component-viewer__preview {
            background: #e7e7ea;
            border: 1px solid #d3d3d7;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .component-viewer__iframe-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .component-viewer__toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .component-viewer__iframe-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            transform-origin: center center;
            transition: transform 0.2s ease;
            overflow: auto;
        }

        .component-viewer__iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Overlay Controls */
        .component-viewer__overlay-controls {
            position: absolute;
            bottom: -1px;
            right: -1px;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .component-viewer__zoom-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .component-viewer__control-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 28px;
            padding: 0 8px;
            background: transparent;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: #333;
            transition: background-color 0.2s ease;
            font-family: Lato, sans-serif;
            font-size: 0.875rem;
            white-space: nowrap;
        }

        .component-viewer__control-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .component-viewer__control-btn:active {
            background: rgba(0, 0, 0, 0.1);
        }

        .component-viewer__control-label {
            font-size: 0.875rem;
            color: #333;
        }

        .component-viewer__show-code-btn {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 0;
            padding: 4px 12px;
            font-family: Lato, sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
            border-bottom: 2px solid transparent;
        }

        .component-viewer__show-code-btn:hover {
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .component-viewer__show-code-btn:active {
            transform: translateY(1px);
        }

        .component-viewer__show-code-btn--active {
            border-bottom-color: #1f1f5f;
        }

        /* Code Display Section */
        .component-viewer__code {
            padding: 16px;
            background: #272822;
            display: flex;
            align-items: flex-start;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition:
                opacity 0.3s ease,
                max-height 0.3s ease,
                padding 0.3s ease;
        }

        .component-viewer__code--visible {
            opacity: 1;
            max-height: 2000px;
            padding: 16px;
        }

        .component-viewer__code-content {
            margin: 0;
            padding: 0;
            font-family: "Roboto Mono", monospace;
            font-size: 1rem;
            line-height: 1.5rem;
            color: #e6e6e6;
            overflow-x: auto;
            white-space: pre;
            width: 100%;
        }

        .component-viewer__code-content code {
            font-family: inherit;
            padding: 0;
            margin: 0;
            display: block;
        }

        /* Typing cursor animation */
        .typing-cursor::after {
            content: "|";
            animation: blink 0.7s infinite;
            margin-left: 2px;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }

        /* Action Buttons */
        .component-viewer__actions {
            padding: 4px 0;
            /* sp-xxs token: 4px top/bottom */
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            /* sp-sm token */
        }

        .component-viewer__button {
            padding: 12px 16px;
            background: white;
            border: 1px solid #1f1f5f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-family: Lato, sans-serif;
            font-size: 0.875rem;
            font-weight: 700;
            line-height: 1.25rem;
            color: #1f1f5f;
            transition: all 0.2s ease;
        }

        .component-viewer__button:hover {
            background: #e7e7ea;
        }

        .component-viewer__button:active {
            transform: translateY(1px);
        }

        .component-viewer__button i {
            font-size: 16px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .component-viewer__toolbar {
                padding: 4px;
            }

            .component-viewer__code {
                padding: 12px;
            }

            .component-viewer__code-content {
                font-size: 0.875rem;
            }

            .component-viewer__actions {
                flex-direction: column;
            }

            .component-viewer__button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .component-viewer__toolbar {
                padding: 4px;
            }
        }

        /* Accessibility */
        @media (prefers-contrast: more) {
            .component-viewer__button {
                border-width: 2px;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {

            .component-viewer__code,
            .component-viewer__button,
            .component-viewer__control-btn,
            .component-viewer__iframe-content {
                transition: none;
            }
        }
    </style>
</head>

<body>
    [component://output]

    <!-- Client-Side Hydration Script -->
    <script>
        (function () {
            'use strict';

            class ComponentViewerClient {
                constructor(container) {
                    this.container = container;
                    this.iframe = null;
                    this.zoomContainer = null;
                    this.codePanel = null;
                    this.codeDisplay = null;
                    this.currentZoom = 1;
                    this.isCodeVisible = false;
                    this.extractedCode = '';

                    // Parse props from data-hydration-props
                    try {
                        const propsData = container.dataset.hydrationProps;
                        this.props = propsData ? JSON.parse(propsData) : {};
                    } catch (error) {
                        console.error('Failed to parse hydration props:', error);
                        this.props = {};
                    }

                    this.currentZoom = this.props.initialZoom || 1;
                    this.isCodeVisible = this.props.showCodeByDefault || false;

                    // Query DOM elements after render
                    this.iframe = container.querySelector('[data-iframe]');
                    this.zoomContainer = container.querySelector('[data-zoom-container]');
                    this.codePanel = container.querySelector('[data-code-panel]');
                    this.codeDisplay = container.querySelector('[data-code-display]');

                    this.setupEventListeners();

                    if (this.currentZoom !== 1) {
                        this.applyZoom();
                    }

                    // Wait for iframe to load, then extract code
                    if (this.iframe) {
                        this.iframe.addEventListener('load', () => {
                            setTimeout(() => this.extractIframeContent(), 1000);
                        });
                    }
                }

                setupEventListeners() {
                    const buttons = this.container.querySelectorAll('[data-action]');
                    buttons.forEach(button => {
                        const action = button.dataset.action;
                        if (action === 'zoom-in') button.addEventListener('click', () => this.handleZoomIn());
                        if (action === 'zoom-out') button.addEventListener('click', () => this.handleZoomOut());
                        if (action === 'zoom-reset') button.addEventListener('click', () => this.handleZoomReset());
                        if (action === 'toggle-code') button.addEventListener('click', () => this.handleToggleCode());
                        if (action === 'copy') button.addEventListener('click', () => this.handleCopy());
                        if (action === 'open-new-tab') button.addEventListener('click', () => this.handleOpenNewTab());
                    });
                }

                handleZoomIn() {
                    this.currentZoom = Math.min(this.currentZoom + 0.1, 2);
                    this.applyZoom();
                }

                handleZoomOut() {
                    this.currentZoom = Math.max(this.currentZoom - 0.1, 0.5);
                    this.applyZoom();
                }

                handleZoomReset() {
                    this.currentZoom = 1;
                    this.applyZoom();
                }

                applyZoom() {
                    if (this.zoomContainer) {
                        this.zoomContainer.style.transform = 'scale(' + this.currentZoom + ')';
                    }
                }

                handleToggleCode() {
                    this.isCodeVisible = !this.isCodeVisible;

                    if (this.codePanel) {
                        if (this.isCodeVisible) {
                            this.codePanel.classList.add('component-viewer__code--visible');
                            if (!this.extractedCode) {
                                this.extractIframeContent();
                            }
                        } else {
                            this.codePanel.classList.remove('component-viewer__code--visible');
                        }
                    }

                    const toggleText = this.container.querySelector('[data-code-toggle-text]');
                    if (toggleText) {
                        toggleText.textContent = this.isCodeVisible ? 'Hide code' : 'See code';
                    }

                    const toggleButton = this.container.querySelector('[data-action="toggle-code"]');
                    if (toggleButton) {
                        toggleButton.setAttribute('aria-label', this.isCodeVisible ? 'Hide code' : 'See code');
                    }
                }

                extractIframeContent() {
                    try {
                        if (!this.iframe) {
                            this.displayCode(this.props.codeExample || '<!-- Iframe not found -->');
                            return;
                        }

                        const iframeDoc = this.iframe.contentDocument || (this.iframe.contentWindow && this.iframe.contentWindow.document);

                        if (!iframeDoc) {
                            console.warn('Cannot access iframe document');
                            this.displayCode(this.props.codeExample || '<!-- Unable to access iframe -->');
                            return;
                        }

                        // Try multiple selectors
                        const selectors = [
                            '#storybook-root',
                            '[data-story-block]',
                            '.sb-story',
                            '#storybook-docs',
                            '[id*="story"]',
                            '#root',
                            'body'
                        ];

                        let root = null;
                        for (let i = 0; i < selectors.length; i++) {
                            const element = iframeDoc.querySelector(selectors[i]);
                            if (element && element.innerHTML.trim()) {
                                root = element;
                                break;
                            }
                        }

                        if (root && root.innerHTML.trim()) {
                            let extractedHTML = root.innerHTML.trim();

                            // Strip outer container if it's a single div
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = extractedHTML;

                            if (tempDiv.children.length === 1 && tempDiv.children[0].tagName.toLowerCase() === 'div') {
                                extractedHTML = tempDiv.children[0].innerHTML.trim();
                            }

                            this.displayCode(extractedHTML);
                        } else {
                            this.displayCode(this.props.codeExample || '');
                        }
                    } catch (error) {
                        console.error('Error extracting iframe content:', error);
                        this.displayCode(this.props.codeExample || '<!-- Error extracting content -->');
                    }
                }

                displayCode(code) {
                    this.extractedCode = code;

                    if (this.codeDisplay) {
                        this.codeDisplay.textContent = code;
                    }
                }

                handleCopy() {
                    const copyTextEl = this.container.querySelector('[data-copy-text]');
                    const code = this.extractedCode || this.props.codeExample || '';

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(code).then(function () {
                            if (copyTextEl) {
                                const originalText = copyTextEl.textContent;
                                copyTextEl.textContent = 'Copied!';
                                setTimeout(function () {
                                    copyTextEl.textContent = originalText;
                                }, 2000);
                            }
                        }).catch(function (err) {
                            console.error('Copy failed:', err);
                        });
                    }
                }

                handleOpenNewTab() {
                    if (this.iframe) {
                        const src = this.iframe.getAttribute('src');
                        if (src) window.open(src, '_blank');
                    }
                }
            }

            // Initialize all ComponentViewer instances
            function initComponentViewers() {
                const containers = document.querySelectorAll('[data-hydration-component="component-viewer"]');
                containers.forEach(function (container) {
                    new ComponentViewerClient(container);
                });
            }

            // Auto-initialize on DOMContentLoaded
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initComponentViewers);
            } else {
                initComponentViewers();
            }
        })();
    </script>
</body>

</html>
