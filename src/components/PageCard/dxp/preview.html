<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageCard Component Preview</title>

    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Lato", system-ui, sans-serif;
            background: #ffffff;
            color: #1F1E27;
            padding: 2rem;
            min-height: 100vh;
        }

        /* PageCard Component Root */
        .nt-page-card {
            width: 100%;
            display: block;
        }

        .nt-page-card__grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(353px, 1fr));
            gap: 16px;
            width: 100%;
        }

        /* Grid list items */
        .nt-page-card__grid>div {
            width: 100%;
            height: 100%;
        }

        /* Card base styling */
        .nt-page-card .card {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: 1px solid #D3D3D7;
            overflow: hidden;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .nt-page-card .card--clickable {
            cursor: pointer;
        }

        .nt-page-card .card--clickable:hover {
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08);
            border-color: #D3D3D7;
        }

        .nt-page-card .card--clickable:focus {
            outline: none;
        }

        .nt-page-card .card--clickable:focus-visible {
            box-shadow: 0px 0px 0px 4px #FFAB00;
            border-radius: 0px;
        }

        /* Media section - 16:9 aspect ratio */
        .nt-page-card .card__media {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #F0F0F3;
        }

        .nt-page-card .card__media--16-9 {
            aspect-ratio: 16 / 9;
        }

        .nt-page-card .card__media img {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Body content section */
        .nt-page-card .card-body {
            display: flex;
            flex-direction: column;
            padding: 24px 32px 40px 32px;
            flex: 1;
        }

        .nt-page-card .card__body-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nt-page-card .card__body-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Grid title (H2) */
        .nt-page-card__title {
            margin: 0 0 16px 0;
            font-family: "Lato", system-ui, sans-serif;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.33;
            color: #1F1E27;
            word-wrap: break-word;
        }

        .nt-page-card__description {
            margin: 0 0 16px 0;
            font-family: "Lato", system-ui, sans-serif;
            font-size: 16px;
            line-height: 24px;
            color: #1F1E27;
            max-width: 72ch;
        }

        /* Card title styling */
        .nt-page-card .card-title {
            margin: 0;
            flex: 1 1 0;
            font-family: "Lato", system-ui, sans-serif;
            font-size: 20px;
            font-weight: 700;
            line-height: 24px;
            color: #1f1f5f;
            word-wrap: break-word;
            transition: color 0.2s ease;
        }

        .nt-page-card .card--clickable:hover .card-title {
            color: #0046a8;
        }

        /* Error state */
        .page-card-error {
            background: #fde3e3;
            border: 1px solid #d32f2f;
            border-radius: 0px;
            padding: 32px;
            margin: 16px;
            text-align: center;
        }

        .page-card-error p {
            margin: 12px 0;
            color: #d32f2f;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .nt-page-card .card-body {
                padding: 16px 24px 32px 24px;
            }

            .nt-page-card .card-title {
                font-size: 18px;
                line-height: 22px;
            }
        }

        @media (max-width: 480px) {
            .nt-page-card .card-body {
                padding: 12px 16px 24px 16px;
            }

            .nt-page-card .card-title {
                font-size: 16px;
                line-height: 20px;
            }
        }

        /* Accessibility */
        @media (prefers-contrast: more) {
            .nt-page-card .card {
                border-width: 2px;
            }

            .nt-page-card .card--clickable:focus-visible {
                outline: 1px solid #1f1f5f;
                outline-offset: 8px;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {

            .nt-page-card .card,
            .nt-page-card .card-title {
                transition: none;
            }
        }
    </style>
</head>

</body>

</html>
