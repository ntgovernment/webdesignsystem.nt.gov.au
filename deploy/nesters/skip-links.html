<!-- 
  NT Design System - SKIP LINKS Nester
  Squiz Matrix Area: skip_links (design_area="nest_content")
  
  Accessibility navigation for keyboard users to skip to main content areas.
  Links are hidden by default but become visible when focused via keyboard navigation.
-->

<nav class="nt-skip-links" aria-label="Skip links">
    <a href="#content" class="nt-skip-link">Skip to main content</a>
    <a href="#nt-header-root" class="nt-skip-link">Skip to navigation</a>
    <a href="#footer" class="nt-skip-link">Skip to footer</a>
</nav>

<style>
    /* Skip link styles - inline to ensure they work without global CSS */
    .nt-skip-links {
        position: relative;
        z-index: 10000;
    }

    .nt-skip-link {
        position: absolute;
        top: -100px;
        left: 0;
        padding: 0.5rem 1rem;
        background-color: #1f1f5f;
        color: white;
        text-decoration: none;
        font-family: "Lato", system-ui, sans-serif;
        font-size: 1rem;
        border: 2px solid white;
        border-radius: 4px;
        z-index: 10001;
    }

    .nt-skip-link:focus {
        top: 10px;
        left: 10px;
        outline: 3px solid #ffd700;
        outline-offset: 2px;
    }

    .nt-skip-link:hover {
        background-color: #2a2a7a;
    }
</style>
