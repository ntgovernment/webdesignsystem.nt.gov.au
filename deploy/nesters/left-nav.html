<!-- 
  NT Design System - LEFT NAVIGATION Nester
  Squiz Matrix Area: left_nav_content (design_area="nest_content")
  
  Left navigation sidebar with 2-level collapsible menu.
  Features auto-expansion of sections containing the active page and mobile drawer.
  Uses vanilla JavaScript component (no React dependency).
  
  CONFIGURATION via data attributes:
  - data-default-expanded: Comma-separated list of section IDs to expand by default
  - data-mobile-breakpoint: Mobile breakpoint in pixels (default: 768)
  
  DEPENDENCIES:
  - Font Awesome Kit (loaded in head nester)
  - ntg-design-system.css (loaded in head nester)
  - left-nav.js (loaded in footer-js nester)
  
  SQUIZ MATRIX INSTRUCTIONS:
  1. Mark active page with aria-current="page" on the appropriate link
  2. Customize menu items by editing the HTML structure below
  3. Use %globals_asset_url:1590990% for internal links
  
  MENU STRUCTURE:
  - Top-level items without children: Simple links
  - Top-level items with children: Collapsible sections with submenu
  - Submenu items: Links indented under parent section
-->

<div id="nt-leftnav-root" data-default-expanded="" data-mobile-breakpoint="768">
    <nav class="nt-leftnav" aria-label="Main navigation">
        <ul class="nt-leftnav__list">
            <!-- Home - Simple link with icon -->
            <li class="nt-leftnav__item">
                <a href="#home" class="nt-leftnav__link" aria-current="page">
                    <div class="nt-leftnav__icon" data-colour="Black">
                        <div style="width: 18.75px; height: 16.67px; background: var(--clr-link-default, #1F1F5F);">
                        </div>
                    </div>
                    <span>Home</span>
                </a>
            </li>

            <!-- About - Simple link -->
            <li class="nt-leftnav__item">
                <a href="#about" class="nt-leftnav__link">
                    <span>About</span>
                </a>
            </li>

            <!-- Design - Simple link -->
            <li class="nt-leftnav__item">
                <a href="#design" class="nt-leftnav__link">
                    <span>Design</span>
                </a>
            </li>

            <!-- Develop - Simple link -->
            <li class="nt-leftnav__item">
                <a href="#develop" class="nt-leftnav__link">
                    <span>Develop</span>
                </a>
            </li>

            <!-- Foundations - Collapsible section with children -->
            <li class="nt-leftnav__item">
                <button class="nt-leftnav__toggle" aria-expanded="false" aria-controls="submenu-foundations">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span>Foundations</span>
                    </div>
                    <div class="nt-leftnav__chevron">
                        <i class="fa-light fa-chevron-right" aria-hidden="true"></i>
                    </div>
                </button>
                <ul id="submenu-foundations" class="nt-leftnav__submenu" aria-hidden="true">
                    <li class="nt-leftnav__item">
                        <a href="#colour" class="nt-leftnav__link">
                            <span>Colour</span>
                        </a>
                    </li>
                    <li class="nt-leftnav__item">
                        <a href="#typography" class="nt-leftnav__link">
                            <span>Typography</span>
                        </a>
                    </li>
                    <li class="nt-leftnav__item">
                        <a href="#iconography" class="nt-leftnav__link">
                            <span>Iconography</span>
                        </a>
                    </li>
                    <li class="nt-leftnav__item">
                        <a href="#grids" class="nt-leftnav__link">
                            <span>Grids</span>
                        </a>
                    </li>
                    <li class="nt-leftnav__item">
                        <a href="#spacing" class="nt-leftnav__link">
                            <span>Spacing</span>
                        </a>
                    </li>
                    <li class="nt-leftnav__item">
                        <a href="#border-width" class="nt-leftnav__link">
                            <span>Border width</span>
                        </a>
                    </li>
                    <li class="nt-leftnav__item">
                        <a href="#radius" class="nt-leftnav__link">
                            <span>Radius</span>
                        </a>
                    </li>
                    <li class="nt-leftnav__item">
                        <a href="#elevation" class="nt-leftnav__link">
                            <span>Elevation</span>
                        </a>
                    </li>
                    <li class="nt-leftnav__item">
                        <a href="#logo" class="nt-leftnav__link">
                            <span>Logo</span>
                        </a>
                    </li>
                    <li class="nt-leftnav__item">
                        <a href="#focus-state" class="nt-leftnav__link">
                            <span>Focus state</span>
                        </a>
                    </li>
                </ul>
            </li>

            <!-- Components - Simple link -->
            <li class="nt-leftnav__item">
                <a href="#components" class="nt-leftnav__link">
                    <span>Components</span>
                </a>
            </li>

            <!-- Help and Support - Simple link -->
            <li class="nt-leftnav__item">
                <a href="#help-support" class="nt-leftnav__link">
                    <span>Help and Support</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- JavaScript fallback message -->
    <noscript>
        <div style="padding: 1rem; background-color: #f5f5f7; border: 1px solid #d3d3d7;">
            <strong>JavaScript Required:</strong> The left navigation requires JavaScript for interactive features.
        </div>
    </noscript>
</div>
