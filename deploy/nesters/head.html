<!-- 
  NT Design System - HEAD Nester
  Squiz Matrix Area: head (design_area="nest_content")
  
  This nester contains essential meta tags, stylesheets, and external dependencies
  for the NT Government Design System.
  
  REQUIRED ASSETS:
  1. Font Awesome Kit - Update with your Kit URL
  2. NT Design System Global Stylesheet - Reference via %globals_asset_url%
-->

<!-- Character encoding and viewport -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Page title -->
<title>%asset_name%</title>

<!-- Page - 01 SEO //-->

<!-- Search engine support //-->
<meta name="page-title" content="%asset_name%" />
<meta name="page-description" content="%asset_metadata_description^empty:%" />
<meta name="page-robots" content="%asset_metadata_robots^empty:index,follow%" />
<meta name="Title" content="%asset_name%" />
<meta name="Description" content="%asset_metadata_description^empty:%" />

<!-- Page - 03 Visual //-->

<!-- Banner //-->
<meta name="page.banner-type" content="%asset_metadata_bannerType^empty:Primary%" />
<meta name="page.banner-image" content="%asset_metadata_bannerImage^empty:%" />
<meta name="page.storybook-url" content="%asset_metadata_storybookUrl^empty:%" />
<meta name="page.figma-url" content="%asset_metadata_figmaUrl^empty:%" />

<!-- Favicon (update with NT Gov favicon URL) -->
<link rel="icon" type="image/svg+xml" href="https://nt.gov.au/_design/latest/images/favicon.svg">

<!-- Font Awesome Kit - REQUIRED for icons -->
<!-- TODO: Replace with your Font Awesome Kit URL -->
<script src="https://kit.fontawesome.com/d8e5f638f7.js" crossorigin="anonymous"></script>

<!-- NT Design System Global Stylesheet -->
<!-- 1590990 will be replaced with your Git File Bridge asset ID during build -->
<link rel="stylesheet" href="%globals_asset_url_with_hash:1590990:deploy/web-design-system.min.css%">

<!-- Prism.js for ComponentViewer syntax highlighting -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism-okaidia.min.css">

<!-- Preconnect to external resources for performance -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
